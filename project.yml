name: iosTerminal
options:
  bundleIdPrefix: com.ethanaldrich
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.5.0
  CSSH:
    url: https://github.com/DimaRU/Libssh2Prebuild
    exactVersion: 1.11.0-OpenSSL-1-1-1w

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: BA256NPZGA
    CODE_SIGN_STYLE: Automatic

targets:
  iosTerminal:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SwiftTerm
      - package: CSSH
      # --- mosh (GPL; personal build only, vendored) ---
      - framework: Vendor/mosh.xcframework
        embed: false                 # static (ar archive) → linked in
      - framework: Vendor/Protobuf_C_.xcframework
        embed: true                  # actually a dynamic dylib → must embed + sign-on-copy
      - sdk: libcurses.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanaldrich.iosTerminal
        PRODUCT_NAME: iosTerminal
        TARGETED_DEVICE_FAMILY: "1"            # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to unlock iosTerminal."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MOSH_ENABLED
        CLANG_CXX_LIBRARY: "libc++"
    scheme:
      testTargets:
        - iosTerminalTests

  iosTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: iosTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanaldrich.iosTerminalTests
        GENERATE_INFOPLIST_FILE: YES
